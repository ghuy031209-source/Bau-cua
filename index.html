<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎲 Bầu Cua Coin</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;

    background:
        radial-gradient(circle at top, #ff6b35 0%, transparent 35%),
        linear-gradient(145deg, #5b0000, #a90000 45%, #4b0000);
}

/* HEADER */

.header {
    padding: 25px 15px 10px;
}

.title {
    margin: 0;
    font-size: 32px;
    color: #ffd700;
    text-shadow:
        0 3px 0 #7a0000,
        0 0 15px #ffb300;
}

.subtitle {
    margin-top: 8px;
    color: #ffe9a6;
}

/* COIN */

.coin-box {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    margin: 15px auto;
    padding: 10px 22px;

    border: 2px solid #ffd700;
    border-radius: 30px;

    background: rgba(0,0,0,0.3);
    box-shadow: 0 0 15px rgba(255,215,0,.35);

    font-size: 22px;
    font-weight: bold;
}

.coin {
    font-size: 27px;
}

/* GAME */

.game {
    width: min(95%, 500px);
    margin: auto;
    padding: 18px;

    border: 2px solid #ffd700;
    border-radius: 25px;

    background: rgba(70,0,0,.72);
    box-shadow:
        0 15px 40px rgba(0,0,0,.4),
        inset 0 0 25px rgba(255,180,0,.08);
}

/* ANIMALS */

.animals {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.animal {
    position: relative;

    padding: 15px 5px;

    border: 3px solid transparent;
    border-radius: 18px;

    background: linear-gradient(#fff, #eee);

    color: #333;

    cursor: pointer;

    transition:
        transform .15s,
        box-shadow .15s,
        border .15s;
}

.animal:active {
    transform: scale(.94);
}

.animal.selected {
    transform: translateY(-5px) scale(1.04);

    border-color: #ffd700;

    box-shadow:
        0 0 10px #ffd700,
        0 0 25px rgba(255,215,0,.8);
}

.icon {
    display: block;
    font-size: 48px;
    margin-bottom: 5px;
}

.name {
    font-size: 17px;
    font-weight: bold;
}

/* MÀU ICON */

.bau .icon {
    filter: hue-rotate(80deg);
}

.cua .icon {
    filter: saturate(2);
}

.tom .icon {
    filter: hue-rotate(330deg) saturate(1.5);
}

.ca .icon {
    filter: hue-rotate(150deg) saturate(1.5);
}

.ga .icon {
    filter: saturate(1.8);
}

.nai .icon {
    filter: sepia(1) saturate(2);
}

/* BET */

.bet-title {
    margin-top: 22px;
    color: #ffd700;
    font-size: 18px;
    font-weight: bold;
}

.bet-control {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
}

.bet-control button,
.max-button {
    border: none;
    border-radius: 10px;

    background: #6b1b1b;
    color: white;

    padding: 10px 14px;
    font-weight: bold;

    cursor: pointer;
}

#bet {
    width: 120px;

    border: 2px solid #ffd700;
    border-radius: 10px;

    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

/* DICE */

.dice-area {
    margin: 25px 0 15px;
}

.dice {
    display: flex;
    justify-content: center;
    gap: 12px;

    min-height: 75px;
}

.die {
    width: 70px;
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background: white;
    color: #333;

    font-size: 45px;

    box-shadow:
        0 5px 10px rgba(0,0,0,.4);
}

.shaking {
    animation: shake .12s infinite alternate;
}

@keyframes shake {
    from {
        transform: rotate(-8deg) translateY(-3px);
    }

    to {
        transform: rotate(8deg) translateY(3px);
    }
}

/* ROLL BUTTON */

.roll-button {
    width: 85%;

    margin: 10px auto;
    padding: 16px;

    border: 3px solid #ffd700;
    border-radius: 18px;

    background: linear-gradient(#ff4747, #b50000);
    color: white;

    font-size: 24px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 0 #620000,
        0 0 15px rgba(255,215,0,.35);
}

.roll-button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #620000;
}

.roll-button:disabled {
    opacity: .6;
}

/* RESULT */

.result {
    min-height: 45px;
    margin: 15px 0;

    color: #ffe68a;
    font-size: 18px;
    font-weight: bold;
}

.win {
    animation: win .6s ease;
}

@keyframes win {
    0% {
        transform: scale(.8);
        opacity: 0;
    }

    60% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* RESET */

.reset {
    margin-top: 5px;

    padding: 9px 18px;

    border: none;
    border-radius: 10px;

    background: #444;
    color: white;

    cursor: pointer;
}

/* MOBILE */

@media(max-width:400px) {

    .title {
        font-size: 27px;
    }

    .game {
        padding: 12px;
    }

    .icon {
        font-size: 40px;
    }

    .die {
        width: 60px;
        height: 60px;
        font-size: 38px;
    }
}
</style>
</head>

<body>

<div class="header">

    <h1 class="title">
        🎲 BẦU CUA COIN 🎲
    </h1>

    <div class="subtitle">
        Game giải trí • Coin ảo
    </div>

    <div class="coin-box">
        <span class="coin">🪙</span>
        <span id="balance">1000</span>
    </div>

</div>


<div class="game">

    <div class="animals">

        <div class="animal bau"
             onclick="selectAnimal('Bầu',this)">
            <span class="icon">🍐</span>
            <span class="name">Bầu</span>
        </div>

        <div class="animal cua"
             onclick="selectAnimal('Cua',this)">
            <span class="icon">🦀</span>
            <span class="name">Cua</span>
        </div>

        <div class="animal tom"
             onclick="selectAnimal('Tôm',this)">
            <span class="icon">🦐</span>
            <span class="name">Tôm</span>
        </div>

        <div class="animal ca"
             onclick="selectAnimal('Cá',this)">
            <span class="icon">🐟</span>
            <span class="name">Cá</span>
        </div>

        <div class="animal ga"
             onclick="selectAnimal('Gà',this)">
            <span class="icon">🐓</span>
            <span class="name">Gà</span>
        </div>

        <div class="animal nai"
             onclick="selectAnimal('Nai',this)">
            <span class="icon">🦌</span>
            <span class="name">Nai</span>
        </div>

    </div>


    <div class="bet-title">
        🪙 Coin cược
    </div>

    <div class="bet-control">

        <button onclick="changeBet(-100)">
            −100
        </button>

        <input
            id="bet"
            value="100"
            inputmode="numeric"
        >

        <button onclick="changeBet(100)">
            +100
        </button>

        <button class="max-button"
                onclick="maxBet()">
            MAX
        </button>

    </div>


    <div class="dice-area">

        <div class="dice" id="dice">

            <div class="die">❓</div>
            <div class="die">❓</div>
            <div class="die">❓</div>

        </div>

    </div>


    <button
        class="roll-button"
        id="rollButton"
        onclick="roll()"
    >
        🎲 LẮC!
    </button>


    <div
        class="result"
        id="result"
    >
        Chọn con bạn muốn chơi!
    </div>


    <button
        class="reset"
        onclick="resetGame()"
    >
        🔄 Chơi lại
    </button>

</div>


<script>

const animals = [
    "Bầu",
    "Cua",
    "Tôm",
    "Cá",
    "Gà",
    "Nai"
];

const emojis = {
    "Bầu": "🍐",
    "Cua": "🦀",
    "Tôm": "🦐",
    "Cá": "🐟",
    "Gà": "🐓",
    "Nai": "🦌"
};

let balance = 1000;
let selected = [];


/* =========================
   ÂM THANH
========================= */

let audioContext;

function sound(type) {

    try {

        if (!audioContext) {
            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        if (type === "coin") {

            oscillator.frequency.value = 880;

            gain.gain.setValueAtTime(
                0.18,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.25
            );

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + 0.25
            );

        } else {

            oscillator.frequency.value = 220;

            gain.gain.setValueAtTime(
                0.12,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.15
            );

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + 0.15
            );
        }

    } catch(e) {}
}


/* =========================
   CHỌN CON
========================= */

function selectAnimal(name, element) {

    sound("click");

    if (selected.includes(name)) {

        selected =
            selected.filter(x => x !== name);

        element.classList.remove("selected");

        showResult(
            "Đã bỏ chọn " + name
        );

        return;
    }

    if (selected.length >= 3) {

        showResult(
            "⚠️ Chỉ chọn tối đa 3 con!"
        );

        return;
    }

    selected.push(name);

    element.classList.add("selected");

    showResult(
        "Đã chọn: " +
        selected.join(" • ")
    );
}


/* =========================
   BET
========================= */

function getBet() {

    let value =
        parseInt(
            document.getElementById("bet").value
        );

    if (isNaN(value)) {
        value = 0;
    }

    return value;
}


function changeBet(amount) {

    let value = getBet();

    value += amount;

    if (value < 100)
        value = 100;

    if (value > balance)
        value = balance;

    document.getElementById("bet").value =
        value;
}


function maxBet() {

    document.getElementById("bet").value =
        balance;
}


/* =========================
   ROLL
========================= */

function roll() {

    if (selected.length === 0) {

        showResult(
            "⚠️ Hãy chọn ít nhất 1 con!"
        );

        return;
    }

    let bet = getBet();

    if (bet <= 0 || bet > balance) {

        showResult(
            "⚠️ Số coin không hợp lệ!"
        );

        return;
    }

    balance -= bet;

    updateBalance();

    const button =
        document.getElementById("rollButton");

    button.disabled = true;

    const dice =
        document.querySelectorAll(".die");

    dice.forEach(d => {
        d.classList.add("shaking");
    });

    let animationCount = 0;

    const animation =
        setInterval(() => {

            dice.forEach(d => {

                const random =
                    animals[
                        Math.floor(
                            Math.random() *
                            animals.length
                        )
                    ];

                d.textContent =
                    emojis[random];
            });

            animationCount++;

            if (animationCount >= 15) {

                clearInterval(animation);

                dice.forEach(d => {
                    d.classList.remove(
                        "shaking"
                    );
                });

                finishRoll(bet);
            }

        }, 100);
}


/* =========================
   FINISH
========================= */

function finishRoll(bet) {

    const result = [
        randomAnimal(),
        randomAnimal(),
        randomAnimal()
    ];

    const dice =
        document.querySelectorAll(".die");

    dice.forEach((d, i) => {
        d.textContent =
            emojis[result[i]];
    });

    let count = 0;

    selected.forEach(name => {

        result.forEach(item => {

            if (name === item) {
                count++;
            }

        });

    });


    /*
       Coin ảo:
       Không trúng = 0
       Trúng 1 = +2 lần cược
       Trúng 2 = +3 lần cược
       Trúng 3 = +4 lần cược
    */

    if (count === 0) {

        showResult(
            "😢 Không trúng lần này!"
        );

    } else {

        const reward =
            bet * (count + 1);

        balance += reward;

        updateBalance();

        sound("coin");

        showResult(
            "🎉 Trúng " +
            count +
            " lần! +" +
            reward.toLocaleString("vi-VN") +
            " 🪙"
        );

    }

    document
        .getElementById("result")
        .classList.add("win");

    setTimeout(() => {

        document
            .getElementById("result")
            .classList.remove("win");

    }, 600);

    document
        .getElementById("rollButton")
        .disabled = false;
}


/* =========================
   RANDOM
========================= */

function randomAnimal() {

    return animals[
        Math.floor(
            Math.random() *
            animals.length
        )
    ];
}


/* =========================
   UI
========================= */

function updateBalance() {

    document.getElementById("balance")
        .textContent =
        balance.toLocaleString("vi-VN");
}


function showResult(text) {

    document.getElementById("result")
        .textContent = text;
}


/* =========================
   RESET
========================= */

function resetGame() {

    balance = 1000;

    selected = [];

    updateBalance();

    document.getElementById("bet")
        .value = 100;

    document.getElementById("dice")
        .innerHTML = `
            <div class="die">❓</div>
            <div class="die">❓</div>
            <div class="die">❓</div>
        `;

    document.querySelectorAll(".animal")
        .forEach(element => {

            element.classList.remove(
                "selected"
            );

        });

    document.getElementById("rollButton")
        .disabled = false;

    showResult(
        "Chọn con bạn muốn chơi!"
    );
}

</script>

</body>
</html>
